site_name: RPG Kingdom Design Bible
site_description: Shared creative direction and approved game design decisions
repo_url: https://github.com/Shashakar/RPG-Kingdom-Design-Bible
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - Vision: vision.md
  - World:
      - Overview: world/index.md
      - Restoration: world/restoration.md
      - Restoration Presentation: world/restoration-presentation.md
      - Environment Guidelines: world/environment-guidelines.md
      - Infrastructure and Travel: world/infrastructure.md
      - Future Simulation: world/future-simulation.md
      - Visual Direction Worklist: world/visual-direction-worklist.md
  - Visual Identity:
      - Overview: visual/index.md
      - Art Direction: visual/art-direction.md
      - Rekindle-Claude Baseline: visual/rekindle-claude-baseline.md
      - Settlement and Forest References: visual/settlement-forest-reference-brief.md
      - Legacy RPG Kingdom Evidence: visual/existing-game-evidence.md
      - World Composition: visual/world-composition.md
      - Restoration Transformations: visual/restoration-transformations.md
      - Actor Silhouettes: visual/actor-silhouettes.md
      - UI and Combat Readability: visual/ui-combat-readability.md
      - Reference Governance: visual/reference-governance.md
  - Characters:
      - Overview: characters/index.md
      - Soul-State Guide: characters/soul-state-guide.md
      - Actor Art Standard: characters/actor-art-standard.md
  - Gameplay:
      - Overview: gameplay/index.md
      - Vertical Slice: gameplay/vertical-slice.md
      - First-Session Journey: gameplay/first-session-journey.md
      - Controls and Targeting: gameplay/controls-targeting.md
      - Progression: gameplay/progression.md
      - Cooperative Play: gameplay/cooperative-play.md
  - Interface:
      - Overview: interface/index.md
      - UX Patterns: interface/ux-patterns.md
      - Character Presentation: interface/character-presentation.md
  - Decisions:
      - Overview: decisions/index.md
      - Asset Standards: decisions/asset-standards.md
      - Collaboration Boundaries: decisions/collaboration-boundary.md
      - Creative Quality: decisions/creative-quality.md
      - Decision Provenance: decisions/decision-provenance.md
      - System Capability Map: decisions/system-capability-map.md
      - Architecture Design Implications: decisions/architecture-design-implications.md
      - Framework Evaluations: decisions/framework-evaluations.md
      - Visual Evidence: decisions/visual-evidence.md
      - Source Coverage Audit: decisions/source-audit.md
  - Contributing: contributing.md
