site_name: RPG Kingdom Design Bible
site_description: Shared creative direction and approved game design decisions
repo_url: https://github.com/Shashakar/RPG-Kingdom-Design-Bible
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: amber
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - Vision: vision.md
  - World:
      - Overview: world/index.md
      - Visual Direction Worklist: world/visual-direction-worklist.md
  - Characters: characters/index.md
  - Gameplay: gameplay/index.md
  - Interface: interface/index.md
  - Decisions:
      - Overview: decisions/index.md
      - Asset Standards: decisions/asset-standards.md
      - Collaboration Boundaries: decisions/collaboration-boundary.md
  - Contributing: contributing.md
